<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NeuroShield Guard Settings</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      max-width: 520px;
      margin: 40px auto;
      background: #0e1611;
      color: #f1f9f4;
      padding: 24px;
      border: 1px solid #1e3b29;
      border-radius: 12px;
      font-size: 13px;
    }
    h2 { color: #5cd488; margin-bottom: 8px; font-size: 18px; }
    p { color: #94b8a1; margin-bottom: 20px; font-size: 12px; line-height: 1.5; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 12px; }
    input[type="text"] {
      width: 100%;
      background: #16221b;
      border: 1px solid #335540;
      padding: 10px;
      border-radius: 6px;
      color: #f1f9f4;
      font-size: 13px;
    }
    .radio-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: #16221b;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #1e3b29;
    }
    .radio-item {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }
    .btn-save {
      background: #2a9f55;
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-save:hover { opacity: 0.9; }
    .status-msg { margin-top: 10px; color: #34d399; font-weight: 600; display: none; }
  </style>
</head>
<body>
  <h2>🛡️ NeuroShield Guard Configuration</h2>
  <p>Manage your real-time protection client connection and privacy settings.</p>

  <div class="form-group">
    <label for="api-url">NeuroShield Core API URL</label>
    <input type="text" id="api-url" placeholder="http://localhost:3000" />
    <span style="font-size: 11px; color: #648b72; margin-top: 4px; display: block;">Default: http://localhost:3000 or your hosted NeuroShield endpoint</span>
  </div>

  <div class="form-group">
    <label>Privacy & Telemetry Mode</label>
    <div class="radio-group">
      <label class="radio-item">
        <input type="radio" name="privacy-mode" value="STANDARD" checked />
        <span><strong>Standard Protection</strong> — Cloud threat correlation with PII scrubbing</span>
      </label>
      <label class="radio-item">
        <input type="radio" name="privacy-mode" value="LOCAL_ONLY" />
        <span><strong>Strict Offline / Local Only</strong> — Do not send telemetry to backend server</span>
      </label>
    </div>
  </div>

  <button id="btn-save" class="btn-save">Save Settings</button>
  <button id="btn-test" class="btn-save" style="background: #1e3b29; margin-left: 8px;">Test Connection</button>
  <div id="status" class="status-msg">Settings saved successfully!</div>

  <script src="options.js"></script>
</body>
</html>
